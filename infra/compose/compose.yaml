# version: "3.9"

services:
  app:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    container_name: logcollector-app
    ports:
      - "8080:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      # LC DB
      SPRING_LC_DATASOURCE_URL: jdbc:mariadb://logcollector-db:3306/logcollector
      SPRING_LC_DATASOURCE_USERNAME: root
      SPRING_LC_DATASOURCE_PASSWORD: root

      # KB DB
      SPRING_KB_DATASOURCE_URL: jdbc:mariadb://logcollector-db:3306/knowledge_base
      SPRING_KB_DATASOURCE_USERNAME: kb_root
      SPRING_KB_DATASOURCE_PASSWORD: root

      # Redis
      REDIS_HOST: logcollector-redis
      REDIS_PORT: "6379"

      # ES
      ES_HOST: elasticsearch
      ES_PORT: "9200"

      # JWT
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-key-must-be-32chars-min-padding}
      LOGFIXER_WEBHOOK_SECRET: ${LOGFIXER_WEBHOOK_SECRET:-local-dev-webhook-secret-32chars}

    depends_on:
      logcollector-db:
        condition: service_healthy
      logcollector-redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  logcollector-db:
    image: mariadb:latest
    container_name: logcollector-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - logcollector-db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  logcollector-redis:
    image: redis:7-alpine
    container_name: logcollector-redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - logcollector-redis-data:/data

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: logcollector-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ../../frontend
    container_name: logcollector-frontend
    ports:
      - "80:80"
    depends_on:
      - app

